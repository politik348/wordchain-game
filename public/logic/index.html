<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모여로직 | 모여게임즈</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>:root{font-family:system-ui,sans-serif;color:#334155;background:#fff7ed}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px}h1{margin:0;color:#ec4899}.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 8px 28px #eab8a344;margin-top:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}button,select{border:0;border-radius:13px;padding:10px 14px;background:#fce7f3;color:#9d174d;font-weight:750;cursor:pointer}button.active{background:#ec4899;color:white}button:disabled{opacity:.4}#board{display:grid;justify-content:center;overflow:auto;padding:8px;touch-action:pan-x pan-y}.clue{display:flex;align-items:center;justify-content:flex-end;gap:3px;padding:3px;font-weight:800;color:#64748b;font-size:13px}.clue.col{flex-direction:column;justify-content:flex-end}.clue.done{color:#16a34a}.cell{width:var(--cell);height:var(--cell);background:#fff;border:1px solid #e2e8f0;display:grid;place-items:center;cursor:pointer;user-select:none;touch-action:none;font-size:17px}.cell.filled{background:#ec4899;box-shadow:inset 0 0 0 2px #f9a8d4}.cell.cross{color:#cbd5e1}.cell:nth-child(5n){border-right-color:#94a3b8}.tools{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#64748b;font-size:14px}.levels{display:flex;gap:8px;flex-wrap:wrap}.level.done{background:#dcfce7;color:#166534}.celebrate{font-size:20px;font-weight:800;color:#db2777}#preview{display:grid;grid-template-columns:repeat(10,12px);gap:1px}#preview i{width:12px;height:12px;background:#f1f5f9}#preview i.on{background:#ec4899}@media(max-width:600px){main{padding:12px}.panel{padding:12px}.clue{font-size:11px;gap:1px}h1{font-size:25px}}.logic-home-link{display:inline-flex;align-items:center;padding:9px 13px;margin-bottom:9px;border-radius:12px;background:#fce7f3;color:#9d174d;font-size:12px;font-weight:800;text-decoration:none}.logic-home-link:hover{background:#fbcfe8}</style></head><body><main><div class="top"><div><a class="logic-home-link" href="/">← 모여게임즈 홈</a><h1>🐱 모여로직</h1><div class="muted">숫자를 따라 숨겨진 그림을 완성해요!</div></div><div id="stats" class="muted"></div></div><section class="panel"><div class="top"><div><strong id="title"></strong><div id="subtitle" class="muted"></div></div><div class="tools"><select id="size"><option value="5">5×5 입문</option><option value="10">10×10 보통</option><option value="15">15×15 도전</option></select><button id="reset">다시 시작</button></div></div><div id="board"></div><div class="tools"><button id="fill" class="active">■ 색칠</button><button id="cross">× 빈칸</button><button id="erase">⌫ 지우기</button><button id="undo">↶ 취소</button><button id="hint">💡 힌트</button></div><p id="message" class="muted">숫자는 연속으로 색칠할 칸의 개수예요. 숫자 사이에는 빈칸이 필요해요.</p></section><section class="panel"><h3>🎨 그림 도감 · 스테이지</h3><div id="levels" class="levels"></div><p class="muted">완성한 퍼즐은 이 브라우저에 저장됩니다.</p></section></main><script>
const shapes=[{name:'하트',size:5,art:['01110','11111','11111','01110','00100']},{name:'고양이',size:10,art:['1100000011','1110000111','1111111111','1101101101','1111111111','1110110111','0111111110','0011111100','0001111000','0000110000']},{name:'컵',size:10,art:['0000000000','0011111100','0010000101','0010000111','0010000111','0010000101','0011111100','0001111000','0011111100','0000000000']},{name:'꽃',size:10,art:['0001100000','0011110000','0111111000','0111111000','0011110000','0001100000','0001100000','0011110000','0111111000','0001100000']},{name:'별',size:5,art:['00100','01110','11111','01110','10101']},{name:'집',size:10,art:['0000110000','0001111000','0011111100','0111111110','1111111111','0110000110','0110110110','0110110110','0110110110','0111111110']},{name:'왕관',size:15,art:['000000010000000','000100010001000','000110010011000','000111010111000','000111111111000','000111111111000','000011111110000','000011111110000','000111111111000','001111111111100','001111111111100','001111111111100','001111111111100','001111111111100','000000000000000']}];
const key='moyeo-logic-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let level=0,mode='fill',grid=[],history=[],locked=false;const $=x=>document.getElementById(x);function persist(){localStorage.setItem(key,JSON.stringify(saved))}function clues(a){let runs=[],n=0;for(let v of [...a,0]){if(v)n++;else if(n){runs.push(n);n=0}}return runs.length?runs:[0]}function getPuzzle(){return shapes[level]}function start(i){level=i;locked=false;history=[];const p=getPuzzle();grid=Array.from({length:p.size},()=>Array(p.size).fill(0));$('size').value=String(p.size);$('title').textContent=`${i+1}단계 · ???`;$('subtitle').textContent=`${p.size}×${p.size} · 그림을 맞혀보세요`;$('message').textContent='숫자에 맞춰 칸을 채워보세요.';render();}function apply(r,c){if(locked)return;let v=mode==='fill'?1:mode==='cross'?2:0;if(grid[r][c]===v)v=0;history.push(grid.map(row=>row.slice()));grid[r][c]=v;render();check()}function render(){const p=getPuzzle(),n=p.size,cell=Math.max(19,Math.min(n===5?43:32,Math.floor((Math.min(window.innerWidth,800)-105)/n))),clueW=n===5?62:n===10?83:105,clueH=n===5?65:n===10?95:115;const b=$('board');b.style.gridTemplateColumns=`${clueW}px repeat(${n},${cell}px)`;b.style.gridTemplateRows=`${clueH}px repeat(${n},${cell}px)`;b.style.setProperty('--cell',cell+'px');b.replaceChildren();let corner=document.createElement('div');b.append(corner);const rowCl=p.art.map(s=>clues([...s].map(Number)));const colCl=Array.from({length:n},(_,c)=>clues(p.art.map(s=>+s[c])));for(let c=0;c<n;c++){let e=document.createElement('div');e.className='clue col';e.innerHTML=colCl[c].map(x=>`<span>${x}</span>`).join('');if(clues(grid.map(row=>row[c]===1?1:0)).join()==colCl[c].join())e.classList.add('done');b.append(e)}for(let r=0;r<n;r++){let e=document.createElement('div');e.className='clue';e.innerHTML=rowCl[r].map(x=>`<span>${x}</span>`).join('');if(clues(grid[r].map(v=>v===1?1:0)).join()==rowCl[r].join())e.classList.add('done');b.append(e);for(let c=0;c<n;c++){let el=document.createElement('div');el.className='cell'+(grid[r][c]===1?' filled':grid[r][c]===2?' cross':'');el.textContent=grid[r][c]===2?'×':'';el.dataset.r=r;el.dataset.c=c;b.append(el)}}renderLevels();$('stats').textContent=`완성 ${Object.keys(saved).filter(k=>saved[k]).length}/${shapes.length}`;}let drag=false,dragValue=null;$('board').addEventListener('pointerdown',e=>{const t=e.target.closest('.cell');if(!t)return;drag=true;dragValue=mode==='fill'?1:mode==='cross'?2:0;apply(+t.dataset.r,+t.dataset.c);e.preventDefault()});$('board').addEventListener('pointermove',e=>{if(!drag)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(!t||!$('board').contains(t))return;let r=+t.dataset.r,c=+t.dataset.c;if(grid[r][c]!==dragValue){history.push(grid.map(row=>row.slice()));grid[r][c]=dragValue;render();check()}});window.addEventListener('pointerup',()=>drag=false);function check(){const p=getPuzzle();if(grid.every((row,r)=>row.every((v,c)=>(v===1)===(p.art[r][c]==='1')))){locked=true;saved[level]=true;persist();$('title').textContent=`완성! ${p.name}`;$('subtitle').textContent='새 그림을 도감에 등록했어요!';$('message').innerHTML='<span class="celebrate">🎉 정답! 멋지게 완성했어요!</span>';render()}}function renderLevels(){const el=$('levels');el.replaceChildren();shapes.forEach((p,i)=>{let b=document.createElement('button');b.className='level'+(saved[i]?' done':'');b.textContent=`${saved[i]?'★':'🔒'} ${i+1} · ${saved[i]?p.name:p.size+'×'+p.size}`;b.onclick=()=>start(i);el.append(b)})}for(let m of ['fill','cross','erase'])$(m).onclick=()=>{mode=m;for(let k of ['fill','cross','erase'])$(k).classList.toggle('active',k===m)};$('undo').onclick=()=>{if(history.length&&!locked){grid=history.pop();render()}};$('hint').onclick=()=>{if(locked)return;let p=getPuzzle(),candidates=[];for(let r=0;r<p.size;r++)for(let c=0;c<p.size;c++)if((grid[r][c]===1)!==(p.art[r][c]==='1'))candidates.push([r,c]);if(!candidates.length)return;let [r,c]=candidates[0];history.push(grid.map(row=>row.slice()));grid[r][c]=p.art[r][c]==='1'?1:2;render();check()};$('reset').onclick=()=>start(level);$('size').onchange=e=>{let idx=shapes.findIndex(p=>p.size===+e.target.value);if(idx>=0)start(idx)};window.addEventListener('resize',render);start(0);
</script><link rel="stylesheet" href="/pregame.css?v=20261120pg1"><script type="module" src="/standalone-pregame.mjs?v=20261120pg1"></script></body></html>
