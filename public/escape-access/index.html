<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f1e5"><title>모여 방탈출 · 주인장 승인 대기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 65% 20%,#384765 0%,#182238 43%,#0e1727 90%);color:#fff8ec;font-family:system-ui,'Malgun Gothic',sans-serif;display:grid;place-items:center;padding:24px}.shell{max-width:720px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:0 0 26px}.top a{color:#e9e1d9;text-decoration:none;font-weight:800;font-size:13px}.top span{font-size:11px;letter-spacing:3px;color:#c6b99a}.card{border:1px solid #ffffff33;border-radius:28px;padding:clamp(24px,5vw,48px);background:linear-gradient(135deg,#27374fdf,#181e32e6);box-shadow:0 30px 85px #0009;position:relative;overflow:hidden}.moon{position:absolute;right:-70px;top:-125px;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2cb,#c3b6a0 65%,#9b8d80);box-shadow:0 0 140px #fae0ae4b;opacity:.28;pointer-events:none}.eyebrow{color:#e7c795;font-size:12px;letter-spacing:3px;font-weight:900}.card h1{font-size:clamp(34px,7vw,56px);letter-spacing:-2px;margin:12px 0 5px}.subtitle{font-size:20px;color:#efd5ab;margin:0 0 32px}.story{font-size:14px;line-height:1.95;max-width:480px;color:#d5d9e2}.access{border:1px solid #ffffff30;background:#fff9;border-radius:16px;background:#0d172a9c;padding:21px 22px;margin:30px 0 20px}.access strong{font-size:19px}.access p{line-height:1.8;font-size:13px;color:#d9dce9;margin:11px 0 0}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.buttons a,.buttons button{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:12px;border:1px solid #e7d1a1;background:#f0d49a;color:#223146;text-decoration:none;font-size:13px;font-weight:900;cursor:pointer}.buttons .secondary{background:transparent;color:#f4e4c6}.buttons .hidden{display:none}.small{font-size:12px;line-height:1.8;color:#b6bccc}.status{color:#f9dfb1} @media(max-width:500px){.card{padding:26px 20px}.buttons a,.buttons button{width:100%}}
</style></head><body><main class="shell"><nav class="top"><a href="/">← 모여게임즈</a><span>MOYEO · PRIVATE ESCAPE</span></nav><div class="card"><div class="moon"></div><div class="eyebrow">EPISODE 01 · OWNER APPROVAL REQUIRED</div><h1>모여 방탈출</h1><p class="subtitle">13번째 종소리</p><p class="story">멈춘 시계, 기억을 잃은 고양이 미로, 달빛 저택에 숨겨진 비밀.<br>이 저택의 문은 주인장의 허락을 받은 탐험가에게만 열립니다.</p><section class="access" aria-live="polite"><strong id="gateTitle">이용 자격을 확인하는 중…</strong><p id="gateText">로그인과 주인장 승인 상태를 확인하고 있습니다.</p><div class="buttons"><a class="hidden" id="loginButton" href="/?auth=login&amp;next=%2Fescape-access%2Findex.html">로그인 / 회원가입</a><a class="hidden" id="playButton" href="/escape/index.html">🔓 저택 입장하기</a><button class="secondary" type="button" id="refreshButton">승인 상태 다시 확인</button></div></section><p class="small">관리자가 방탈출 이용 권한을 별도로 승인해야 합니다. 관리자 비밀키는 회원에게 공개하거나 전달하지 않습니다.</p></div></main>
<script>
const title=document.getElementById('gateTitle'),description=document.getElementById('gateText'),login=document.getElementById('loginButton'),play=document.getElementById('playButton'),refresh=document.getElementById('refreshButton');
async function check(){refresh.disabled=true;title.textContent='승인 상태 확인 중…';description.textContent='서버의 현재 회원 정보와 플레이 권한을 확인하고 있습니다.';login.classList.add('hidden');play.classList.add('hidden');try{const res=await fetch('/api/escape/access',{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw Error('서버 연결을 확인할 수 없습니다.');const state=await res.json();if(!state.storageConfigured){title.textContent='서비스 준비 중';description.textContent='회원가입용 영구 저장소 또는 운영자 키 설정이 완료되지 않았습니다. 주인장에게 문의해 주세요.';}else if(!state.authenticated){title.textContent='회원 로그인이 필요합니다';description.textContent='모여게임즈에 로그인한 뒤 주인장에게 방탈출 플레이를 요청하세요.';login.classList.remove('hidden');}else if(!state.approved){title.textContent='주인장의 승인을 기다리는 중';description.textContent=(state.account?.dripNickname||'회원')+'님, 아직 플레이 승인이 없습니다. 주인장이 관리자 화면에서 회원 닉네임을 승인하면 입장할 수 있습니다.';}else{title.textContent='입장이 허가되었습니다!';description.textContent=(state.account?.dripNickname||'탐험가')+'님, 저택의 문이 열렸습니다. 준비가 됐다면 첫 번째 에피소드를 시작해 주세요.';play.classList.remove('hidden');}}catch(e){title.textContent='인증 상태 조회 실패';description.textContent=e.message;}finally{refresh.disabled=false;}}
refresh.addEventListener('click',check);check();
</script></body></html>
