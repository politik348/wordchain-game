<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" role="img" aria-labelledby="catTitle catDesc">
<title id="catTitle">왕관을 쓴 모여게임즈 고양이</title>
<desc id="catDesc">회색과 흰색의 통통한 고양이가 황금 왕관과 빨간 망토를 입고 앞발을 들며 웃고 있다. 주변에는 별, 주사위, 블록과 게임 타일이 떠 있다.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffefa"/><stop offset=".68" stop-color="#fff4e7"/><stop offset="1" stop-color="#ffd6b9"/></linearGradient>
 <linearGradient id="gray" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#a5a2a3"/><stop offset="1" stop-color="#69676e"/></linearGradient>
 <linearGradient id="cape" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#ff8677"/><stop offset=".45" stop-color="#e7494b"/><stop offset="1" stop-color="#ac2d3d"/></linearGradient>
 <linearGradient id="gold" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#fff49c"/><stop offset=".48" stop-color="#ffcb43"/><stop offset="1" stop-color="#f59a22"/></linearGradient>
 <linearGradient id="tile" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff9e8"/><stop offset="1" stop-color="#f6dcbf"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb6a5"/><stop offset="1" stop-color="#f77d88"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#aa5d50" flood-opacity=".20"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
 <clipPath id="headClip">
