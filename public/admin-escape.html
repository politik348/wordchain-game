<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7f0"><title>모여게임즈 · 방탈출 승인 관리</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:system-ui,'Malgun Gothic',sans-serif;color:#372f3d;background:linear-gradient(140deg,#ffefe1,#fff8f1,#e8eef8)}main{width:min(540px,100%);background:#fff;border:1px solid #eee2dc;border-radius:25px;padding:30px;box-shadow:0 20px 65px #4e36551a}a{color:#a65c5f;text-decoration:none;font-size:13px;font-weight:700}h1{font-size:25px;letter-spacing:-.7px;margin:18px 0 10px}p{font-size:13px;color:#817b84;line-height:1.85}form{display:grid;gap:16px;margin-top:24px}label{font-size:12px;font-weight:900;display:grid;gap:8px}input{height:46px;padding:10px 13px;border:1.5px solid #eadfe0;border-radius:12px;font-size:14px;width:100%;outline:none}input:focus{border-color:#e79b82;box-shadow:0 0 0 3px #fcebe5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:13px 12px;border:0;border-radius:12px;font-weight:900;cursor:pointer;background:#df7890;color:white}button.cancel{background:#f5e9eb;color:#a74e60}button:disabled{opacity:.5}.result{margin-top:17px;background:#eaf7f0;color:#287656;padding:15px;border-radius:12px;font-size:13px;line-height:1.7}.result.error{background:#fff0ed;color:#b44246}.list{margin-top:25px}.list button{background:#f3e7e1;color:#85536b;font-size:12px}.entries{margin-top:12px;display:grid;gap:7px;max-height:300px;overflow:auto}.member{display:flex;justify-content:space-between;gap:10px;background:#faf7f6;padding:12px;border-radius:11px;font-size:12px}.member strong{display:block;font-size:13px}.member small{color:#8c8490}.member em{font-style:normal;color:#a94e60;font-weight:900}.member em.on{color:#32785c}.hint{background:#f7f4ef;border-radius:12px;padding:12px 14px;font-size:12px;color:#817781;line-height:1.75}
</style></head><body><main><a href="/admin.html">← 가입번호 관리</a> · <a href="/admin-members.html">회원 관리 전체 보기 →</a><h1>🔐 방탈출 출입 허가</h1><p>주인장이 <strong>기존 관리자 키</strong>로 로그인한 회원의 방탈출 이용을 승인하거나 철회합니다. 회원에게 관리자 키를 전달하지 마세요.</p><div class="hint">회원은 먼저 드립대학 닉네임으로 가입·로그인해야 합니다. 가입 승인과 방탈출 플레이 승인은 서로 다릅니다.</div><form id="accessForm"><label>관리자 인증키<input type="password" name="adminKey" required minlength="24" autocomplete="off" placeholder="MOYEO_ADMIN_KEY"></label><label>승인할 회원의 드립대학 닉네임<input name="dripNickname" required minlength="2" maxlength="24" autocomplete="off" placeholder="정확한 닉네임"></label><div class="buttons"><button type="button" data-approve="true">방탈출 이용 승인</button><button type="button" class="cancel" data-approve="false">승인 철회</button></div></form><div id="message" class="result" hidden role="status"></div><section class="list"><button id="showMembers" type="button">회원 승인 현황 조회</button><div class="entries" id="members"></div></section><p>관리자 키는 저장하지 않습니다. 사용한 후 페이지를 닫으면 입력 내용이 사라집니다.</p></main><script>
const form=document.getElementById('accessForm'),message=document.getElementById('message'),list=document.getElementById('members');const controls=[...form.querySelectorAll('[data-approve]')];
function show(messageText,isError=false){message.hidden=false;message.textContent=messageText;message.classList.toggle('error',isError)}
async function api(method,body){const key=form.elements.adminKey.value;if(!key)throw Error('운영자 인증키를 입력하세요.');const response=await fetch('/api/admin/escape-access',{method,headers:{'Authorization':'Bearer '+key,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const json=await response.json();if(!response.ok)throw Error(json.error||'요청 실패');return json;}
for(const button of controls)button.addEventListener('click',async()=>{controls.forEach(x=>x.disabled=true);try{const approve=button.dataset.approve==='true';const data=await api('POST',{dripNickname:form.elements.dripNickname.value.trim(),approve});show(data.account.dripNickname+'님 방탈출 권한: '+(data.approved?'승인 완료':'승인 철회 완료'));}catch(error){show(error.message,true);}finally{controls.forEach(x=>x.disabled=false)}});
document.getElementById('showMembers').addEventListener('click',async()=>{list.replaceChildren();try{const data=await api('GET');for(const member of data.members){const item=document.createElement('div');item.className='member';const detail=document.createElement('div'),name=document.createElement('strong'),account=document.createElement('small'),status=document.createElement('em');name.textContent=member.dripNickname;account.textContent='아이디: '+member.username;status.textContent=member.approved?'이용 허가':'미승인';status.className=member.approved?'on':'';detail.append(name,account);item.append(detail,status);list.append(item);}if(!data.members.length)show('등록 회원이 없습니다.');}catch(error){show(error.message,true)}});
</script></body></html>
