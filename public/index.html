<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8f0" />
  <meta name="description" content="모여게임즈: 친구들과 오목, 마피아, 윷놀이, 그림퀴즈, 도깨비 종, 라이어, 끝말잇기를 무료로 즐기는 실시간 웹게임." />
  <title>모여게임즈 | 친구와 함께 즐기는 일곱 가지 웹게임</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="shell">
    <header class="site-header">
      <div class="header-inner">
        <a href="#" id="brand" class="brand" aria-label="모여게임즈 홈"><span class="logo-mark"><span>✳</span></span><span>모여<span class="brand-accent">게임즈</span></span></a>
        <nav class="desktop-nav" aria-label="주 메뉴"><button class="nav-btn is-current" data-nav="home">게임 둘러보기</button><button class="nav-btn" data-nav="rooms">열린 게임방</button><button class="nav-btn" data-nav="guide">이용 방법</button></nav>
        <div class="header-actions"><span class="online-dot"></span><span class="server-status" id="serverStatus">서버 연결 확인 중</span><button class="account-button" id="nicknameBtn" title="닉네임 설정"><span class="user-emoji">👋</span><span id="headerNickname">게스트</span><span class="edit-icon">✎</span></button></div>
      </div>
    </header>
    <main id="app" tabindex="-1">
      <section class="loading-area"><div class="loading-spinner"></div><p>게임을 준비하는 중...</p></section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><div><span class="footer-logo">✳ 모여게임즈</span><p>같이하면 더 재밌는 우리만의 온라인 놀이터.</p></div><div><span>무료 · 회원가입 없음 · 모바일 지원</span><p>참고 사이트를 바탕으로 새로 구현한 독립 프로젝트입니다.</p></div></div></footer>
  </div>
  <div id="toastZone" class="toast-zone" role="status" aria-live="polite"></div>
  <dialog id="nickDialog" class="modal"><form method="dialog" id="nickForm"><button class="dialog-close" type="button" id="closeNick" aria-label="닫기">×</button><div class="modal-mascot">😊</div><h2>어떻게 불러드릴까요?</h2><p>친구들이 알아볼 수 있는 닉네임을 정해주세요.</p><label for="nicknameInput" class="field-label">닉네임</label><input id="nicknameInput" class="text-input" maxlength="14" placeholder="예: 말랑감자" autocomplete="off" required /><button class="button button-primary full" type="submit">이 이름으로 시작하기 <span>→</span></button></form></dialog>
  <dialog id="joinDialog" class="modal"><form method="dialog" id="joinForm"><button type="button" class="dialog-close" id="closeJoin" aria-label="닫기">×</button><div class="modal-mascot">🔑</div><h2>초대받은 방에 입장</h2><p>친구가 알려준 6자리 방 코드를 입력하세요.</p><label for="joinInput" class="field-label">초대 코드</label><input id="joinInput" class="text-input code-input" maxlength="6" placeholder="ABC123" autocomplete="off" required /><button class="button button-primary full" type="submit">방 입장하기 <span>→</span></button></form></dialog>
</body>
</html>
