# Render Blueprint for Moyeo Games with an external PostgreSQL database (e.g., Neon).
# Secrets must be set in the Render dashboard. Do not commit database URLs or passwords.
# GitHub changes alone do NOT configure environment variables on an existing web service.
services:
  - type: web
    name: wordchain-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOYEO_ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
