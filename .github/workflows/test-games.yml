name: Test games
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check public/app.js
      - run: node --check public/yut-solo-engine.mjs
      - run: node --check public/yut-solo-ui.mjs
      - run: node --check server.js
      - run: node --check marble-server.mjs
      - run: node --check rummikub/multiplayer.mjs
      - run: node --check public/rummikub/ui.mjs
      - run: node --check public/rummikub/engine.mjs
      - run: node --check public/rummikub/solo.mjs
      - run: node --check public/marble/app.mjs
      - run: node --check public/marble/engine.mjs
